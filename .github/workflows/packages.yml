# .github/workflows/packages.yml
# ──────────────────────────────────────────────────────────────────────────────
# Does every name in install/packages.txt actually resolve on a supported Fedora?
#
# That list carries detailed, hand-maintained claims about availability ("tealdeer is
# orphaned, last built F44", "sd was retired after F41", "wget is now a virtual capability
# provided by wget2-wget"). Nothing mechanically checked any of it: the only auditor was
# the weekly /os-package-availability Claude routine, which is INERT without a
# CLAUDE_CODE_OAUTH_TOKEN secret. A dropped or renamed package therefore surfaced on
# someone's fresh install, months later — and `dnf install --skip-unavailable` means it
# fails SILENTLY, by design.
#
# This is the deterministic half: resolve each name with `dnf repoquery` in a real
# container for each release. It also validates the inverse claim — that the cargo/go
# fallbacks in bootstrap.sh are covering names dnf can no longer supply.
#
# NOT a required status check: it is matrix-heavy and path-filtered, and a required check
# that never runs would deadlock every unrelated PR.
# ──────────────────────────────────────────────────────────────────────────────
name: packages

on:
  pull_request:
    paths: ['install/packages.txt', '.github/workflows/packages.yml']
  push:
    branches: [main]
    paths: ['install/packages.txt', '.github/workflows/packages.yml']
  schedule:
    # Sat 07:00 UTC — an hour ahead of the web showcase (08:00) and the OS-repo Claude
    # routine (09:00), so the fleet never draws on the same slot.
    - cron: "0 7 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: dnf repoquery (${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stable, still-supported releases: a name that will not resolve here is a real
          # break for anyone bootstrapping today, so these BLOCK.
          - release: "43"
            blocking: true
          - release: "44"
            blocking: true
          # rawhide is the early-warning lane: orphaned packages disappear here first
          # (exactly how sd, gron, tealdeer and procs went). Advisory — a drop upstream
          # must not red the repo before it affects a supported release. It is the signal
          # to add a cargo/go fallback in bootstrap.sh BEFORE the next Fedora ships.
          - release: "rawhide"
            blocking: false
    container:
      image: fedora:${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh metadata
        run: dnf -y makecache >/dev/null

      - name: Resolve every package name
        id: resolve
        env:
          BLOCKING: ${{ matrix.blocking }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -uo pipefail
          # Same parse as bootstrap.sh's blib_read_pkgs: strip #-comments and all
          # whitespace (package names contain none), drop blanks.
          mapfile -t pkgs < <(sed 's/#.*//' install/packages.txt | tr -d '[:blank:]' | grep -v '^$')
          echo "::notice::checking ${#pkgs[@]} package names on Fedora $RELEASE"
          missing=()
          for p in "${pkgs[@]}"; do
            # Two probes, because a plain repoquery misses VIRTUAL capabilities: on F42+
            # there is no package literally named `wget` — it is a capability whose default
            # provider is wget2-wget. --whatprovides is what resolves that, and it is the
            # same resolution `dnf install` itself performs.
            if [ -n "$(dnf repoquery --qf '%{name}' "$p" 2>/dev/null)" ]; then
              continue
            fi
            if [ -n "$(dnf repoquery --whatprovides "$p" --qf '%{name}' 2>/dev/null)" ]; then
              echo "  $p -> provided virtually"
              continue
            fi
            missing+=("$p")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "all ${#pkgs[@]} names resolve on Fedora $RELEASE"
            exit 0
          fi

          {
            echo "### Unresolvable on Fedora $RELEASE"
            echo
            for m in "${missing[@]}"; do echo "- \`$m\`"; done
            echo
            echo "Each needs either a rename in \`install/packages.txt\` or a presence-guarded"
            echo "cargo/go fallback in \`bootstrap.sh\` (the pattern already used for"
            echo "\`sd\`, \`gron\`, \`dust\`, \`xh\`, \`viddy\`, \`tealdeer\` and \`procs\`)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BLOCKING" = "true" ]; then
            echo "::error::${#missing[@]} package(s) do not resolve on Fedora $RELEASE: ${missing[*]}"
            exit 1
          fi
          echo "::warning::${#missing[@]} package(s) do not resolve on rawhide: ${missing[*]} — add a fallback before this reaches a stable release"
