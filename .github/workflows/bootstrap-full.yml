# .github/workflows/bootstrap-full.yml
# ──────────────────────────────────────────────────────────────────────────────
# The half of bootstrap.sh that CI never exercised.
#
# The per-PR `bootstrap` workflow runs `--links-only` — the right default, because a real
# provision installs ~37 packages and builds seven Rust crates from source. But that left
# provision() (dnf, RPM Fusion, COPR, the upstream installers, cargo/go, the 1Password
# repo) completely untested, and that is where the failures that actually strand a fresh
# machine live. Two of them shipped undetected:
#
#   * every privileged call was a hard-coded `sudo`, so the script died at the first dnf
#     line on any box without it (a container, a WSL first boot, minimal Server) — which
#     is precisely the environment CI runs in, and precisely why --links-only could not
#     catch it;
#   * the cargo/go presence guards probed $PATH, which does not contain ~/.cargo/bin
#     outside a Core zsh, so every run rebuilt the whole Rust set from scratch.
#
# This runs the REAL thing, as root, in a clean Fedora container. Scheduled + manual only:
# it is far too slow to gate a PR, and it must never be a required status check.
# ──────────────────────────────────────────────────────────────────────────────
name: bootstrap-full

on:
  schedule:
    # Sun 06:00 UTC — off the fleet's Sat slots, and a long run has the weekend to itself.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      image:
        description: Fedora container image to provision against.
        type: string
        default: "fedora:latest"

permissions:
  contents: read

concurrency:
  group: bootstrap-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision:
    name: full bootstrap (${{ inputs.image || 'fedora:latest' }}, as root)
    runs-on: ubuntu-latest
    # Seven from-source Rust builds dominate this; 90 minutes is generous but a hang is
    # what we are testing for, so the cap has to be real.
    timeout-minutes: 90
    container:
      image: ${{ inputs.image || 'fedora:latest' }}
    steps:
      # git is needed for checkout inside the container, and bootstrap's preflight
      # requires it too (the tpm clone).
      - name: Install checkout prerequisites
        run: dnf -y install git-core >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the environment is the one that used to break
        run: |
          echo "uid=$(id -u) ($(id -un))"
          command -v sudo >/dev/null 2>&1 \
            && echo "sudo present" \
            || echo "no sudo — this is the case that exited 127 before the escalator was resolved"

      - name: Run the real bootstrap
        # No --no-flatpak: flatpak is in packages.txt and the Flathub step is skipped on a
        # non-WSL container only when --no-flatpak is passed, so leaving it on exercises
        # that path too. --strict is deliberately NOT used: a rate-limited GitHub API or a
        # COPR outage is an infrastructure blip, not a regression, and the closing summary
        # reports it either way. A non-zero exit here means a HARD failure.
        run: ./bootstrap.sh

      - name: Assert the toolchain actually landed
        # Guards regressions in the presence-check logic: these must exist after a run.
        run: |
          set -u
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.atuin/bin:$PATH"
          rc=0
          for t in zsh tmux nvim git eza bat fd rg zoxide fzf btop jq; do
            command -v "$t" >/dev/null 2>&1 || { echo "MISSING (from dnf): $t"; rc=1; }
          done
          # Best-effort tools: report but never fail — upstream outages are not our bug.
          for t in starship atuin mise lazygit dust xh sd viddy tldr procs doggo sesh gron carapace op yazi; do
            command -v "$t" >/dev/null 2>&1 || echo "::warning::best-effort tool absent: $t"
          done
          exit $rc

      - name: Assert the wiring, and that a second run rebuilds nothing
        run: |
          set -u
          test -L "$HOME/.config/zsh/loader.zsh" || { echo "loader.zsh not linked"; exit 1; }
          grep -q "dotfiles-managed v4" "$HOME/.zshrc" || { echo "HOME/.zshrc is not the managed loader"; exit 1; }
          echo "── second run (idempotency) ──"
          out=$(./bootstrap.sh 2>&1)
          echo "$out" | tail -20
          # The regression that made every re-run cost minutes: a PATH-only presence guard
          # reporting "missing" for tools installed under $HOME/.cargo/bin or $HOME/.local/bin.
          if echo "$out" | grep -qE '^\S*\s*(dust|xh|sd|viddy|tealdeer|procs|yazi) \(cargo'; then
            echo "::error::second run rebuilt a cargo tool — the presence guards regressed"
            exit 1
          fi
